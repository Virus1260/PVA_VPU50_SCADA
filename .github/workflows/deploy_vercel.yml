name: Deploy Qt SCADA to Vercel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Install System Dependencies & Qt
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dev libglvnd0 libxkbcommon-x11-0
          pip install aqtinstall ninja cmake
          # Install Linux Desktop Host Tools
          python3 -m aqt install-qt linux desktop 6.8.2 linux_gcc_64 -m qtquicktimeline qtshadertools --base https://download.qt.io -O $HOME/Qt || python3 -m aqt install-qt linux desktop 6.8.2 linux_gcc_64 --base https://download.qt.io -O $HOME/Qt
          # Install WebAssembly Target
          python3 -m aqt install-qt all_os wasm 6.8.2 wasm_singlethread -m qtquicktimeline qtshadertools --base https://download.qt.io -O $HOME/Qt || python3 -m aqt install-qt all_os wasm 6.8.2 wasm_singlethread --base https://download.qt.io -O $HOME/Qt
          
          # Ensure executable permissions on extracted Qt tools
          chmod -R +x $HOME/Qt/6.8.2/gcc_64/bin || true
          chmod -R +x $HOME/Qt/6.8.2/gcc_64/libexec || true
          chmod -R +x $HOME/Qt/6.8.2/wasm_singlethread/bin || true
          chmod -R +x $HOME/Qt/6.8.2/wasm_singlethread/libexec || true
          
          # Add to Environment
          echo "$HOME/Qt/6.8.2/gcc_64/bin" >> $GITHUB_PATH
          echo "$HOME/Qt/6.8.2/wasm_singlethread/bin" >> $GITHUB_PATH

      - name: Build WebAssembly Application
        run: |
          chmod +x $HOME/Qt/6.8.2/wasm_singlethread/bin/qt-cmake || true
          $HOME/Qt/6.8.2/wasm_singlethread/bin/qt-cmake -B build_wasm -S . -DCMAKE_BUILD_TYPE=Release -G Ninja -DQT_HOST_PATH=$HOME/Qt/6.8.2/gcc_64
          cmake --build build_wasm --parallel $(nproc)
          mkdir -p dist
          cp -r build_wasm/App/* dist/ 2>/dev/null || true
          cp -r build_wasm/* dist/ 2>/dev/null || true
          if [ -f "dist/PVA_VPU50_SCADAApp.html" ]; then
            cp dist/PVA_VPU50_SCADAApp.html dist/index.html
          fi
          cp vercel.json dist/ 2>/dev/null || true

      - name: Deploy to Vercel
        run: |
          mkdir -p .vercel
          echo '{"projectId":"${{ secrets.VERCEL_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}' > .vercel/project.json
          npx vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: ./dist
