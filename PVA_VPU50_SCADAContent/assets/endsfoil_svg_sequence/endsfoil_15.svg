<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c3842" />
      <stop offset="25%" stop-color="#768a98" />
      <stop offset="48%" stop-color="#f4f9fd" />
      <stop offset="72%" stop-color="#566a78" />
      <stop offset="100%" stop-color="#1c2630" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f9fd" />
      <stop offset="35%" stop-color="#768a98" />
      <stop offset="75%" stop-color="#3a4b58" />
      <stop offset="100%" stop-color="#1c2630" />
    </linearGradient>
    <linearGradient id="bladeFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#98acc0" />
      <stop offset="30%" stop-color="#f8fcff" />
      <stop offset="68%" stop-color="#607688" />
      <stop offset="100%" stop-color="#304452" />
    </linearGradient>
    <linearGradient id="bladeBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#364654" />
      <stop offset="50%" stop-color="#546878" />
      <stop offset="100%" stop-color="#1e2a34" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Continuous Full-Width Heavy Support Pipe (0.75x Shaft Dia = 12px) -->
  <line x1="125.75" y1="240.00" x2="274.25" y2="240.00" stroke="url(#pipeGrad)" stroke-width="12.0" stroke-linecap="round" filter="url(#dropShadow)" />
  <line x1="125.75" y1="236.50" x2="274.25" y2="236.50" stroke="#ffffff" stroke-width="2" opacity="0.85" />
  <!-- Back Hydrofoil Blade (arm1) -->
  <path d="M 94.64,211.00 L 156.87,223.00 L 156.87,269.00 L 94.64,257.00 Z" fill="url(#bladeBackGrad)" stroke="#18242e" stroke-width="0.75" />
  <!-- Central Shaft -->
  <rect x="192.00" y="0" width="16.0" height="270.0" fill="url(#shaftGrad)" rx="3" filter="url(#dropShadow)" />
  <!-- Turned Hub Collar -->
  <rect x="183.00" y="221.00" width="34.0" height="38.0" fill="url(#shaftGrad)" stroke="#16222c" stroke-width="1" rx="4" filter="url(#dropShadow)" />
  <line x1="183.00" y1="236.00" x2="217.00" y2="236.00" stroke="#f4f9fc" stroke-width="2" opacity="0.9" />
  <!-- Front Hydrofoil Blade (arm2) -->
  <path d="M 241.72,208.00 L 306.77,222.00 L 306.77,272.00 L 241.72,258.00 Z" fill="url(#bladeFrontGrad)" stroke="#20303c" stroke-width="0.75" filter="url(#dropShadow)" />
  <path d="M 241.72,208.00 L 306.77,222.00" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />
</svg>