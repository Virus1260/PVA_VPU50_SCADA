<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 26" width="28" height="26">
  <!-- Process Pipe Inlets -->
  <line x1="0" y1="13" x2="6" y2="13" stroke="#64748b" stroke-width="0.9"/>
  <line x1="22" y1="13" x2="28" y2="13" stroke="#64748b" stroke-width="0.9"/>

  <!-- Left & Right Parallel Flange Plates -->
  <line x1="6" y1="4" x2="6" y2="22" stroke="#ffffff" stroke-width="1.0" stroke-linecap="round"/>
  <line x1="22" y1="4" x2="22" y2="22" stroke="#ffffff" stroke-width="1.0" stroke-linecap="round"/>

  <!-- Valve Disc Chamber (Closed = Solid Red #dc2626) -->
  <rect x="6.5" y="6.5" width="15" height="13" rx="1.5" fill="#dc2626" stroke="#ffffff" stroke-width="0.9"/>
  
  <!-- Closed Vertical Vane -->
  <line x1="14" y1="5.5" x2="14" y2="20.5" stroke="#ffffff" stroke-width="1.1"/>
  
  <!-- Center Pivot Dot -->
  <circle cx="14" cy="13" r="2.0" fill="#ffffff"/>
</svg>
