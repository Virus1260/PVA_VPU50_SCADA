<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="rackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#071c33"/>
    </linearGradient>
    <linearGradient id="activeLED" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="runLED" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Tier 1: Agitator / Power Control Module -->
  <rect x="14" y="14" width="100" height="28" rx="5" fill="url(#rackGrad)" stroke="#0284c7" stroke-width="3"/>
  <rect x="22" y="24" width="18" height="8" rx="2" fill="url(#activeLED)"/>
  <line x1="46" y1="28" x2="82" y2="28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="94" cy="28" r="4" fill="#22c55e"/>
  <circle cx="104" cy="28" r="4" fill="#38bdf8"/>

  <!-- Tier 2: Homogenizer / Speed Drive Module -->
  <rect x="14" y="50" width="100" height="28" rx="5" fill="url(#rackGrad)" stroke="#0284c7" stroke-width="3"/>
  <rect x="22" y="60" width="18" height="8" rx="2" fill="url(#runLED)"/>
  <line x1="46" y1="64" x2="74" y2="64" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <circle cx="86" cy="64" r="4" fill="#38bdf8"/>
  <circle cx="96" cy="64" r="4" fill="#f59e0b"/>
  <circle cx="106" cy="64" r="4" fill="#22c55e"/>

  <!-- Tier 3: Thermal & Vacuum Process Controller -->
  <rect x="14" y="86" width="100" height="28" rx="5" fill="url(#rackGrad)" stroke="#0284c7" stroke-width="3"/>
  <rect x="22" y="96" width="18" height="8" rx="2" fill="url(#activeLED)"/>
  <line x1="46" y1="100" x2="88" y2="100" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="98" cy="100" r="4" fill="#22c55e"/>
  <circle cx="106" cy="100" r="4" fill="#38bdf8"/>

  <!-- Side Mount Rack Rails -->
  <line x1="10" y1="18" x2="10" y2="110" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>
  <line x1="118" y1="18" x2="118" y2="110" stroke="#1e40af" stroke-width="3" stroke-linecap="round"/>
</svg>