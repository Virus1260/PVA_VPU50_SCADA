<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <!-- Solid Structural Outer Gauge Housing/Bezel Ring -->
  <circle cx="50" cy="46" r="34" fill="none" stroke="#38bdf8" stroke-width="3" />
  <circle cx="50" cy="46" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

  <!-- Process Connection Block & Threaded Nipple Flange (Bottom Mounting) -->
  <rect x="45" y="80" width="10" height="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
  <line x1="42" y1="88" x2="58" y2="88" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <!-- Parallel Inlet Pipe OD Walls entering the bottom housing -->
  <line x1="47" y1="80" x2="47" y2="74" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="53" y1="80" x2="53" y2="74" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Radial Measurement Dial Ticks (Vacuum Scale Line Matrix) -->
  <!-- Major Scale Markers -->
  <line x1="26" y1="46" x2="32" y2="46" stroke="#38bdf8" stroke-width="2" />
  <line x1="50" y1="22" x2="50" y2="28" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  <line x1="74" y1="46" x2="68" y2="46" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <!-- Minor Sub-Division Graduation Marks -->
  <line x1="33" y1="29" x2="37" y2="33" stroke="#38bdf8" stroke-width="1.2" />
  <line x1="67" y1="29" x2="63" y2="33" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />

  <!-- Central Pin Center Node -->
  <circle cx="50" cy="46" r="3.5" fill="#38bdf8" />

  <!-- High-Vis Indication Needle pointing sharply left (Decompression / Deep Vacuum state) -->
  <polygon points="50,44 26,45 50,48" fill="#ffffff" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round" />
  
  <!-- "V" Vacuum Measurement Unit Designation Sub-text inside Dial Face -->
  <text x="50" y="66" font-family="monospace, sans-serif" font-size="12" font-weight="bold" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">VAC</text>
</svg>
