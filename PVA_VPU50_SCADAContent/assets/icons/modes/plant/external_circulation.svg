<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <linearGradient id="circPipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Industrial Ointment Vessel Body (Left side of loop) -->
  <path d="M 20,28 L 52,28 L 52,48 A 16,16 0 0 1 36,64 A 16,16 0 0 1 20,48 Z" fill="url(#circPipeGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Vessel Top Rim Flange -->
  <line x1="16" y1="28" x2="56" y2="28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  
  <!-- Bottom Homogenizer Discharge Port Assembly -->
  <rect x="31" y="64" width="10" height="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />

  <!-- Heavy External Circulation Pipeline (Loops from Bottom Discharge -> Up Right Side -> Back into Top Vessel Inlet!) -->
  <path d="M 36,70 L 36,82 L 76,82 L 76,20 L 36,20 L 36,28" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Inline 3-Way Recirculation Divert Valve Symbol on the external pipe loop -->
  <polygon points="70,44 82,44 76,52" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round" />
  <polygon points="70,60 82,60 76,52" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round" />
  <line x1="76" y1="52" x2="84" y2="52" stroke="#38bdf8" stroke-width="2" />
  <circle cx="85" cy="52" r="2.5" fill="#38bdf8" />

  <!-- High-Vis Recirculation Flow Action Arrows along the external pipe loop -->
  <!-- 1. Bottom horizontal exit arrow (Left to Right) -->
  <path d="M 50,82 L 62,82 M 57,78 L 62,82 L 57,86" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 2. Right vertical riser arrow (Bottom to Top) -->
  <path d="M 76,38 L 76,28 M 72,33 L 76,28 L 80,33" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 3. Top return port entry arrow (Right to Left into Vessel) -->
  <path d="M 52,20 L 40,20 M 45,16 L 40,20 L 45,24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
