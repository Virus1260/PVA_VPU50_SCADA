<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Top Flange & Vessel Head -->
  <rect x="40" y="8" width="20" height="4" rx="2" fill="#38bdf8"/>
  
  <!-- Central Unimix Processing Vessel (Dome Top, Cylindrical Sides, Conical Bottom) -->
  <path d="M 32 20 C 32 14, 68 14, 68 20 V 46 L 50 66 L 32 46 Z" stroke="#38bdf8" stroke-width="3" fill="#0f2b4c"/>
  
  <!-- Liquid Batch Fill -->
  <path d="M 34 30 H 66 V 45 L 50 64 L 34 45 Z" fill="#1d4ed8" opacity="0.75"/>
  <line x1="34" y1="30" x2="66" y2="30" stroke="#60a5fa" stroke-width="2"/>

  <!-- External Recirculation Pipe Loop (Starts at Bottom V101 -> Left -> Up -> Top Return V102) -->
  <path d="M 50 66 V 80 C 50 86, 16 86, 16 80 V 20 C 16 14, 50 14, 50 20" stroke="#0284c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 50 66 V 80 C 50 86, 16 86, 16 80 V 20 C 16 14, 50 14, 50 20" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Recirculation Pump Symbol 1M5001 (Centered at X=16, Y=56) -->
  <circle cx="16" cy="56" r="8.5" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 12 62 L 20 56 L 12 50 Z" fill="#4ade80"/>

  <!-- Sleek, Modern Directional Flow Arrows Perfectly Aligned Along Pipe Axes -->
  <!-- Arrow 1: Pointing UP along Left Vertical Pipe Segment (X=16, Y=36) -->
  <path d="M 16 30 L 11 39 H 21 Z" fill="#4ade80"/>

  <!-- Arrow 2: Pointing RIGHT along Top Horizontal Pipe Segment (X=34, Y=14) -->
  <path d="M 39 14 L 30 9 V 19 Z" fill="#4ade80"/>

  <!-- Top Return Valve V102 (Centered on Pipe Entry at X=50, Y=20) -->
  <path d="M 44 20 L 50 16 L 50 24 Z M 56 20 L 50 16 L 50 24 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Bottom Discharge Solenoid Valve V101 (Centered on Discharge Line X=50, Y=66) -->
  <path d="M 50 66 L 45 72 L 55 72 Z M 50 78 L 45 72 L 55 72 Z" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
</svg>
