<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <!-- Fluid mass gradient inside the processing vessel -->
    <linearGradient id="vesselBaseFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Left Side: Realistically Proportioned Bucket Profile -->
  <!-- Flat Base Rim Rim Piece -->
  <ellipse cx="16" cy="74" rx="5" ry="1.5" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="11" y1="74" x2="21" y2="74" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Tapered Outer Bucket Body Walls -->
  <path d="M 7,48 L 11,74 L 21,74 L 25,48" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Top Open Mouth Rim Oval -->
  <ellipse cx="16" cy="48" rx="9" ry="3" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Side Pivot Ear Hook + Dropping Handle Loop -->
  <circle cx="21" cy="57" r="1" fill="#38bdf8" />
  <path d="M 21,57 Q 27,60 27,65 Q 25,69 21,67" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />

  <!-- Internal Liquid Surface Fill Block -->
  <path d="M 9.2,62 A 7,2 0 0 0 22.8,62 L 21,74 L 11,74 Z" fill="#38bdf8" fill-opacity="0.3" />
  <ellipse cx="16" cy="62" rx="6.8" ry="2" fill="none" stroke="#7dd3fc" stroke-width="1" />

  <!-- Right Side: Main Ointment Vessel Hemispherical Shell -->
  <path d="M 40,28 L 88,28 L 88,48 A 24,24 0 0 1 64,72 A 24,24 0 0 1 40,48 Z" fill="url(#vesselBaseFill)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
  <line x1="36" y1="28" x2="92" y2="28" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Internal Detailing: Fine Scraper Anchor Mixer Lines -->
  <path d="M 48,34 L 48,48 A 16,16 0 0 0 64,64 A 16,16 0 0 0 80,48 L 80,34" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3 2" />
  
  <!-- Bottom Homogenizer Inflow Valve Interface -->
  <rect x="58" y="72" width="12" height="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />

  <!-- Fixed Transfer Pipeline: Enters Bucket center-top, dips deep inside, exits cleanly and routes to Bottom Valve -->
  <path d="M 16,70 L 16,42 L 28,42 Q 32,42 32,48 L 32,84 L 64,84 L 64,78" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- High-Vis Upward Vacuum Ingestion Action Arrow (Perfect core alignment into the valve) -->
  <path d="M 64,86 L 64,56" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 59,63 L 64,56 L 69,63" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
