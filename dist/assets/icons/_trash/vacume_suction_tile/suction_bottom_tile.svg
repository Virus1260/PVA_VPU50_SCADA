<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <linearGradient id="vesselBaseFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Heavy Outer UI Button Boundary Border -->
  <rect x="5" y="5" width="90" height="90" rx="14" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.5" />
  
  <!-- Ointment Vessel: Precise Hemispherical Mixing Tank Shell -->
  <path d="M 22,28 L 78,28 L 78,50 A 28,28 0 0 1 50,78 A 28,28 0 0 1 22,50 Z" fill="url(#vesselBaseFill)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Thick Top Flange Seal/Lid Rim Assembly -->
  <line x1="17" y1="28" x2="83" y2="28" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Internal Detailing: Fine Scraper Anchor Mixer Lines -->
  <path d="M 30,34 L 30,50 A 20,20 0 0 0 50,70 A 20,20 0 0 0 70,50 L 70,34" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3 2" />
  
  <!-- Bottom Homogenizer/Discharge Port Collar -->
  <rect x="44" y="78" width="12" height="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Precise Material Inflow Action Arrow (Outside to Inside) -->
  <path d="M 50,88 L 50,66 M 45,72 L 50,66 L 55,72" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
