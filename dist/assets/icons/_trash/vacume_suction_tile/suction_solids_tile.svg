<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <!-- Heavy Outer UI Button Boundary Border -->
  <rect x="5" y="5" width="90" height="90" rx="14" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.5" />
  
  <!-- Industrial Powder Feed Hopper Frame -->
  <path d="M 22,28 L 78,28 L 78,44 L 60,68 L 60,78 L 40,78 L 40,68 L 22,44 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
  <line x1="17" y1="28" x2="83" y2="28" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Wide Powder Extraction Nozzle / Inner Throat Layout -->
  <path d="M 36,28 L 42,52 L 58,52 L 64,28" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Clean Geometric Powder/Granular Particle Array Matrix -->
  <g fill="#7dd3fc" opacity="0.8">
    <circle cx="34" cy="42" r="1.5" /><circle cx="42" cy="46" r="1.2" /><circle cx="50" cy="40" r="1.5" />
    <circle cx="58" cy="45" r="1.2" /><circle cx="66" cy="41" r="1.5" /><circle cx="45" cy="56" r="1.5" />
    <circle cx="54" cy="55" r="1.2" /><circle cx="42" cy="64" r="1.4" /><circle cx="50" cy="62" r="1.6" />
    <circle cx="56" cy="65" r="1.2" /><circle cx="46" cy="72" r="1.5" /><circle cx="53" cy="71" r="1.2" />
  </g>

  <!-- Clear Upward Solids Flow / Vacuum Indication Arrow -->
  <path d="M 50,48 L 50,22 M 44,29 L 50,22 L 56,29" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
