<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <linearGradient id="liquidMass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Heavy Outer UI Button Boundary Border -->
  <rect x="5" y="5" width="90" height="90" rx="14" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.5" />
  
  <!-- Ointment Vessel Container Profile -->
  <path d="M 22,28 L 78,28 L 78,50 A 28,28 0 0 1 50,78 A 28,28 0 0 1 22,50 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
  <line x1="17" y1="28" x2="83" y2="28" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Detailed Liquid Level Surface Line and Volumetric Fill Block -->
  <path d="M 22.5,54 Q 36,51 50,54 T 77.5,54 L 77.5,50 A 27.5,27.5 0 0 1 50,77.5 A 27.5,27.5 0 0 1 22.5,50 Z" fill="url(#liquidMass)" stroke="#7dd3fc" stroke-width="1.5" />
  
  <!-- Center Suction Tube Assembly dipping into liquid -->
  <rect x="47" y="20" width="6" height="42" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="44" y="20" width="12" height="4" fill="#38bdf8" />

  <!-- High-Vis Upward Liquid Suction Action Arrow -->
  <path d="M 50,52 L 50,30 M 45,36 L 50,30 L 55,36" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
