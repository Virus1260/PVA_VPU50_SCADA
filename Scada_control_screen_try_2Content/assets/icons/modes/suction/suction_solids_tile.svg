<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <!-- Scaled-Up Utility Bucket Structural Frame -->
  <!-- Solid Flat Base Rim Footer -->
  <ellipse cx="50" cy="84" rx="12" ry="3" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="38" y1="84" x2="62" y2="84" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Tapered Outer Bucket Side Walls -->
  <path d="M 28,34 L 38,84 L 62,84 L 72,34" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Large Top Open Mouth Rim Oval -->
  <ellipse cx="50" cy="34" rx="22" ry="6" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Mechanical Side Bail Ear Hook & Hanging Handle Bail Loop -->
  <circle cx="70" cy="48" r="1.5" fill="#38bdf8" />
  <path d="M 70,48 Q 82,54 80,64 Q 76,72 68,68" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Technical Industrial Bulk Solids / Powder Particulate Grid Matrix Base -->
  <g fill="#7dd3fc" opacity="0.9">
    <!-- Top layer distribution row -->
    <circle cx="34" cy="56" r="1.5" /><circle cx="42" cy="54" r="1.8" /><circle cx="50" cy="53" r="1.5" /><circle cx="58" cy="55" r="1.8" /><circle cx="66" cy="56" r="1.5" />
    <!-- Middle dense packing rows -->
    <circle cx="36" cy="64" r="1.6" /><circle cx="43" cy="61" r="1.4" /><circle cx="48" cy="65" r="1.8" /><circle cx="53" cy="60" r="1.4" /><circle cx="59" cy="63" r="1.6" /><circle cx="64" cy="64" r="1.4" />
    <circle cx="37" cy="71" r="1.5" /><circle cx="44" cy="70" r="1.8" /><circle cx="50" cy="69" r="1.4" /><circle cx="56" cy="71" r="1.8" /><circle cx="62" cy="70" r="1.5" />
    <!-- Lower base compaction layer -->
    <circle cx="40" cy="78" r="1.6" /><circle cx="46" cy="77" r="1.4" /><circle cx="51" cy="78" r="1.8" /><circle cx="55" cy="76" r="1.4" /><circle cx="60" cy="78" r="1.6" />
  </g>

  <!-- Heavy High-Vis double-walled Suction Pipe (Clear Outer Diameter / OD Detail) -->
  <!-- Left Wall of Dip Pipe -->
  <path d="M 47,68 L 47,14 L 84,14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
  <!-- Right Wall of Dip Pipe forming explicit pipe profile thickness -->
  <path d="M 53,68 L 53,20 L 84,20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
  <!-- Submerged open intake end boundary flange ring -->
  <line x1="47" y1="68" x2="53" y2="68" stroke="#38bdf8" stroke-width="2" />

  <!-- Clear Upward Powder Vacuum Suction Action Flow Arrow inside the pipe column -->
  <path d="M 50,54 L 50,26 M 45,34 L 50,26 L 55,34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
